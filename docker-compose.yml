services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookingdaging-app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: booking_daging_bu_heni
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: bookingdaging-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: booking_daging_bu_heni
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - bookingdaging_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookingdaging_mysql_data:
